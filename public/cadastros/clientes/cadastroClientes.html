<!-- public/cadastros/clientes/cadastroClientes.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Clientes</title>

<style>
  
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Roboto, sans-serif;
  }

  body {
      min-height:100vh;
      display:flex;
      flex-direction:column;
      background:white;
  }


  .header {
    background:#020617;
    color:white;
    padding:15px 30px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    align-items:center;
  }

  .left {justify-self: start;}
  .center {justify-self: center; color: #cbd5f5;}
  .right {justify-self: end;}
  .logout {cursor: pointer; color: #ef4444;}


  main {
      flex: 1;
      background: white;
      padding: 30px;
  }
 
  .card{
    border:1px solid #e2e8f0;
    border-radius:10px;
    padding:15px;
    background:#fff;
    gap:15px;
    margin-bottom:15px;
  }

  h2 {
    margin-top:5px;
    margin-bottom:15px;
    font-size:medium;
    color:#0f172a;
  }


  .grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
  }

  .gridEmpresa{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
  }
  
  .campo{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  
  #campoNomePF{
    grid-column: span 2;
  }

  .full {
    grid-column: span 2;
  }


  label {
    font-size:12px;
    color:#475569;
  }

  input, 
  select {
    width:100%;
    padding:15px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:12px;
  }

  input:focus,
  select:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 2px rgba(59,130,246,.2);
  }

  textarea {
    width: 100%;
    min-height: 180px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    font-size: 14px;
    resize: vertical;
  }

  textarea:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
    outline: none;
  }


  button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
  }

  .salvar{
    background:#22c55e;
    color:white;
  }

  .salvar:hover{
    background:#16a34a;
  }

  .voltar {
    background: #334155;
    color: white;
  }

  .voltar:hover {
    background: #475569;
  }


  svg {
    stroke: currentColor;
  }

  #msg {
    margin-top: 15px;
    font-size: 14px;
  }


  .success { color: #16a34a; }
  .error { color: #dc2626; }


    
  input[type="checkbox"] {
    width: auto;
    padding: 0;
    margin: 0;
  }


  .gridDuplo{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }

  .subCard{
    border:1px solid #e2e8f0;
    border-radius:8px;
    padding:15px;
  }  

  .gridCheckbox{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }

  .itemCheckbox{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:#475569;
  }

  .itemCheckbox input{
    margin:0;
  }

  .gridReferencia{
    display:grid;
    grid-template-columns:2fr 2fr 1fr 2fr;
    gap:15px;
    margin-bottom:15px;
  }  

  #camposPJ {
    display: contents;
  }

  .footer-actions{
    display: flex;
    gap: 10px;
    padding: 25px;
    background: white;
  }

  @media (max-width:1200px){
    .gridEmpresa{
      grid-template-columns:repeat(2,1fr);
    }
  }

  @media (max-width:768px){
    .gridEmpresa{
      grid-template-columns:1fr;
    }
    .gridCheckbox{
      grid-template-columns:1fr;
    }
    .gridDuplo{
      grid-template-columns:1fr;
    }
    #campoNomePF{
      grid-column:span 1;
    }
    .gridReferencia{
      grid-template-columns:1fr;
    }

  }

</style>
</head>

<script>

  // 🔐 AUTH
  const token = localStorage.getItem("token");
  const usuario = localStorage.getItem("usuario");

  if (!token) window.location.href = "../../index.html";

  document.getElementById("usuario").textContent =
    usuario ? `👋 Olá, ${usuario}` : "";

  // ✅ PARAMS
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const modo = params.get("modo");

  // ✅ REMOVE FLICKER DO HEADER IMEDIATAMENTE
  if (modo === "visualizar") {
    document.querySelector(".header").style.display = "none";
  }

  // ✅ VOLTAR
  function voltar(){
    window.location.href = "listaClientes.html";
  }

  function irHome(){
    window.location.href = "../../home.html";
  }

  // ✅ FORMATAR CPF/CNPJ
  function formatarDocumento(valor, tipo){

    valor = valor.replace(/\D/g, "");

    if (tipo === "pf"){
      valor = valor
        .replace(/(\d{3})(\d)/, "$1.$2")
        .replace(/(\d{3})(\d)/, "$1.$2")
        .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
    }

    else if (tipo === "pj"){
      valor = valor
        .replace(/^(\d{2})(\d)/, "$1.$2")
        .replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3")
        .replace(/\.(\d{3})(\d)/, ".$1/$2")
        .replace(/(\d{4})(\d)/, "$1-$2");
    }

    return valor;
  }

  // ✅ FORMATAR CEP
  function formatarCep(valor){

    valor = valor.replace(/\D/g, "");

    valor = valor.replace(
      /^(\d{5})(\d)/,
      "$1-$2"
    );

    return valor;

  }


  // ✅ FORMATAR TELEFONE
  function formatarTelefone(valor){

    valor = valor.replace(/\D/g, "");

    if (valor.length <= 10){

      valor = valor
        .replace(/^(\d{2})(\d)/, "($1) $2")
        .replace(/(\d{4})(\d)/, "$1-$2");

    } else {

      valor = valor
        .replace(/^(\d{2})(\d)/, "($1) $2")
        .replace(/(\d{5})(\d)/, "$1-$2");

    }

    return valor;

  }


  // ✅ VISUALIZAÇÃO
  function ativarModoVisualizacao(){
    document.querySelectorAll("input, select, textarea").forEach(el => {
      el.disabled = true;
    });
    document.querySelector(".salvar").style.display = "none";
    document.getElementById("btnVoltar").style.display = "none";
  }

  // ✅ PF/PJ
  function alterarTipoPessoa(){

    const tipo = document.getElementById("tipoPessoa").value;

    const labelDocumento = document.getElementById("labelDocumento");
    const documento = document.getElementById("documento");
    const campoNomePF = document.getElementById("campoNomePF");
    const camposPJ = document.getElementById("camposPJ");
    const nomePF = document.getElementById("nomePF");

    if (tipo === "pf"){
      labelDocumento.textContent = "CPF";
      documento.placeholder = "Digite o CPF";
      campoNomePF.style.display = "flex";
      camposPJ.style.display = "none";

    } else if (tipo === "pj"){
      labelDocumento.textContent = "CNPJ";
      documento.placeholder = "Digite o CNPJ";
      campoNomePF.style.display = "none";
      nomePF.value = "";
      camposPJ.style.display = "contents";

    } else {
      labelDocumento.textContent = "Documento";
      documento.placeholder = "CPF ou CNPJ";
      campoNomePF.style.display = "none";
      camposPJ.style.display = "contents";
    }
  }


  // ✅ CARREGAR CLIENTE
  async function carregarCliente(){
    try {
      const res = await fetch(`/api/clientes/${id}`, {
        headers: { Authorization: token }
      });

      if (!res.ok){
        alert("Erro ao buscar cliente");
        return;
      }

      const cliente = await res.json();

      // preencher
      document.querySelectorAll("input, select, textarea").forEach(el => {

        if (
          el.type === "checkbox" ||
          el.type === "file"
        ) {
          return;
        }

        if (cliente[el.id] !== undefined) {
          el.value = cliente[el.id] || "";
        }

      });


      document.getElementById("cadastradoPor").value = cliente.cadastradoPor || "";

      // checkboxes
      cliente.ramoAtividade.forEach(v => {
        const el = document.querySelector(`[name="ramoAtividade"][value="${v}"]`);
        if (el) el.checked = true;
      });

      cliente.marcaCompressor.forEach(v => {
        const el = document.querySelector(`[name="marcaCompressor"][value="${v}"]`);
        if (el) el.checked = true;
      });

      // ALVARÁ
      if (cliente.alvara) {
        document.getElementById(
          "btnVerAlvara"
        ).style.display = "flex";
      }

      // CARTÃO CNPJ
      if (cliente.cartaoCnpj) {
        document.getElementById(
          "btnVerCartao"
        ).style.display = "flex";
      }

      alterarTipoPessoa();

    } catch (err){
      console.error(err);
      alert("Erro ao carregar cliente");
    }
  }

  // ✅ SALVAR
  async function salvar(){
    const formData = new FormData();
    document.querySelectorAll("input, select, textarea").forEach(el => {

      // uploads
      if(el.type === "file"){

        if(el.files.length > 0){
          formData.append(
            el.id,
            el.files[0]
          );
        }
      }

      // checkboxes ignorados aqui
      else if(el.type !== "checkbox"){
        formData.append(
          el.id,
          el.value || ""
        );
      }
    });

    const ramos = Array.from(
      document.querySelectorAll(
        '[name="ramoAtividade"]:checked'
      )
    ).map(el => el.value);

    const marcas = Array.from(
      document.querySelectorAll(
        '[name="marcaCompressor"]:checked'
      )
    ).map(el => el.value);

    formData.append(
      "ramoAtividade",
      JSON.stringify(ramos)
    );

    formData.append(
      "marcaCompressor",
      JSON.stringify(marcas)
    );

    formData.set(
      "cadastradoPor",
      usuario || ""
    );

    const url =
      id
        ? `/api/clientes/${id}`
        : "/api/clientes";

    const metodo =
      id
        ? "PUT"
        : "POST";

    try {

      const res = await fetch(url, {
        method: metodo,
        headers: {
          Authorization: token
        },
        body: formData
      });

    const data = await res.json();

    if(!res.ok){
      alert(data.erro || "Erro ao salvar");
      return;
    }

    alert(
      id
        ? "✅ Cliente atualizado!"
        : "✅ Cliente criado!"
    );

    window.location.href =
      "listaClientes.html";

    } catch(err){

      console.error(err);

      alert(
        "Erro ao comunicar com servidor"
      );

  }

}

// ✅ LOAD (TUDO CENTRALIZADO)
  window.addEventListener("load", () => {

    // ✅ formatação documento
    document.getElementById("documento").addEventListener("input", function(e){
      const tipo = document.getElementById("tipoPessoa").value;
      e.target.value = formatarDocumento(e.target.value, tipo);
    });

    // ✅ formatação CEP
    document.getElementById("cep").addEventListener("input", function(e){

      e.target.value =
        formatarCep(e.target.value);
    });

    // ✅ formatação de telefone e celular
    [
      "telefone",
      "celular",

      "telefoneResponsavel1",
      "telefoneResponsavel2",

      "telefoneCompras",
      "telefoneAreaTecnica",
      "telefoneContasPagar",

      "telEmpresa1",
      "telEmpresa2",
      "telEmpresa3"
    ].forEach(id => {
      const campo = document.getElementById(id);
      if (!campo) return;
      campo.addEventListener("input", function(e){
        e.target.value =
          formatarTelefone(e.target.value);
      });
    });



    // ✅ mudança PF/PJ
    document.getElementById("tipoPessoa").addEventListener("change", function(){
      alterarTipoPessoa();
      document.getElementById("documento").value = "";
    });

    if (id){
      carregarCliente().then(() => {
        if (modo === "visualizar"){
          ativarModoVisualizacao();
        }
      });
    } 
    else {
      const agora = new Date();
      const ano = agora.getFullYear();
      const mes = String(agora.getMonth() + 1).padStart(2, "0");
      const dia = String(agora.getDate()).padStart(2, "0");
      const hora = String(agora.getHours()).padStart(2, "0");
      const minuto = String(agora.getMinutes()).padStart(2, "0");
      document.getElementById("dataHora").value =
        `${ano}-${mes}-${dia}T${hora}:${minuto}`;

      document.getElementById("cadastradoPor").value = usuario || "";
    }
  });


  // Visualizar documentos
  async function abrirAlvara(){
    if(!id) return;
    try{
      const res = await fetch(
        `/api/clientes/${id}/alvara`,
        {
          headers:{
            Authorization: token
          }
        }
      );

      if(!res.ok){
        alert("Erro ao abrir Alvará");
        return;
      }

      const blob =
        await res.blob();
      const url =
        window.URL.createObjectURL(blob);
      window.open(url);
    } catch(err){
      console.error(err);
      alert("Erro ao abrir Alvará");
    }
  }

  async function abrirCartao(){
  if(!id) return;
  try{
    const res = await fetch(
      `/api/clientes/${id}/cartao`,
      {
        headers:{
          Authorization: token
        }
      }
    );

    if(!res.ok){
      alert("Erro ao abrir Cartão CNPJ");
      return;
    }

    const blob =
      await res.blob();
    const url =
      window.URL.createObjectURL(blob);
    window.open(url);
  } catch(err){
    console.error(err);
    alert("Erro ao abrir Cartão CNPJ");
  }
}



  // ✅ LOGOUT
  function logout(){
    const confirmar = confirm("⚠️ Deseja realmente sair do sistema?");
    if (!confirmar) return;
    localStorage.removeItem("token");
    localStorage.removeItem("usuario");
    window.location.href = "../../index.html";
  }

</script>
