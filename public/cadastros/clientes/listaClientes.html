<!-- public/cadastros/clientes/listaClientes.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Lista de Clientes</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Roboto, sans-serif;
  }

  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:white;
  }

  /* HEADER */
  .header {
    background: #020617;
    color: white;
    padding: 15px 30px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: center;
  }

  .left { justify-self: start; }
  .center { justify-self: center; color: #cbd5f5; }
  .right { justify-self: end; }

  .logout {
    cursor: pointer;
    color: #ef4444;
  }

main{
  flex:1;
  background:white;
  padding:30px;
}

  h2 {
    margin-bottom: 15px;
    color: #0f172a;
  }

  input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    margin-bottom: 15px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th {
    background: #020617;
    color: white;
    padding: 10px;
  }

  td{
    padding:10px;
    border-bottom:1px solid #e2e8f0;
    text-align:center;
  }

  tr:hover {
    background: #f1f5f9;
  }

  td button{
    cursor:pointer;
    margin:2px;
    padding:6px 8px;
    font-size:12px;
    border:none;
    border-radius:6px;
  }

/* Paginação */

  #paginacao {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin: 30px 0;
  }

  #paginacao button {
    flex: unset;
    padding: 6px 12px;
    font-size: 13px;
    border: 1px solid #cbd5e1;
    background: transparent;
    color: #475569;
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  #paginacao button:hover:not(:disabled) {
    background: #f1f5f9;
    border-color: #94a3b8;
  }

  #paginacao button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  #infoPagina {
    font-size: 13px;
    color: #64748b;
    font-weight: 500;
    min-width: 90px;
    text-align: center;
  }

  .footer-actions{
    display:flex;
    gap:10px;
    padding:25px;
    background:white;
  }  

  .footer-actions button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
  }


  .voltar {
    background: #334155;
    color: white;
  }

  .voltar:hover {
    background: #475569;
  }

  .continuar {
    background: #22c55e;
    color: white;
  }

  .continuar:hover {
    background: #16a34a;
  }


  .exportar{
    background:#e4af1f;
    color:white;
  }

  .exportar:hover{
    background:#ecc149;
  }

  .novo{
    background:#22c55e;
    color:white;
  }

  .novo:hover{
    background:#16a34a;
  }




  td button {
    margin: 2px;
    padding: 6px 8px;
    font-size: 12px;
    border-radius: 6px;
  }

  td button:hover {
    opacity: 0.8;
  }



  @media print{

    .header,
    .footer-actions,
    #busca,
    #paginacao,
    .logout{
      display:none !important;
    }

    body,
    main{
      margin:0;
      padding:0;
      background:white;
    }

    h2{
      text-align:center;
      margin-bottom:12px;
      font-size:18px;
      color:black;
    }

    table{
      width:auto;
      margin:auto;
      border-collapse:collapse;
      font-size:11px;
    }

    /* Oculta coluna ações */

    table th:nth-child(5),
    table td:nth-child(5){
      display:none;
    }

    th:nth-child(1),
    td:nth-child(1){
      width:250px;
    }

    th:nth-child(2),
    td:nth-child(2){
      width:130px;
    }

    th:nth-child(3),
    td:nth-child(3){
      width:120px;
    }

    th:nth-child(4),
    td:nth-child(4){
      width:120px;
    }

    th,
    td{
      border:1px solid #f3f7f8;
      padding:4px 6px;
      text-align:center;
    }

    th{
      background:white !important;
      color:black !important;
    }

  }



</style>
</head>

<body>

<header class="header">
  <div class="left">
    <h1 onclick="irHome()" style="cursor:pointer;">S.I.I.V.</h1>
  </div>

  <div class="center">
    <span id="usuario"></span>
  </div>

  <div class="right">
    <span class="logout" onclick="logout()"> SAIR ➜] </span>
  </div>
</header>

<main>

<h2>CLIENTES CADASTROS</h2>

<input id="busca" placeholder="🔍 Buscar cliente...">

<table>
  <thead>
    <tr>
      <th>NOME</th>
      <th>DOCUMENTO</th>
      <th>CIDADE</th>
      <th>TELEFONE</th>
      <th>AÇÕES</th>
    </tr>
  </thead>
  <tbody id="tabela"></tbody>
</table>

<div id="paginacao" style="
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin:30px;
">
  <button id="btnAnterior" 
  class="pgVoltar" 
  onclick="paginaAnterior()"
  > ◀ ANTERIOR </button>

  <span id="infoPagina"></span>

  <button
    id="btnProxima"
    class="pgContinuar"
    onclick="proximaPagina()"
  > PRÓXIMA ▶ </button>
</div>

</main>

  <footer class="footer-actions">

    <button
      class="voltar"
      onclick="voltar()">
      ⬅ VOLTAR
    </button>

    <button
      class="novo"
      onclick="novoCliente()">
      ➕ NOVO CLIENTE
    </button>

    <button
      class="exportar"
      onclick="exportarPDF()">
      🖨️ EXPORTAR PDF
    </button>

  </footer>




<script>

  // 🔐
  const token = localStorage.getItem("token");

  if (!token) {
    window.location.href = "../../index.html";
  }

  const usuario = localStorage.getItem("usuario");

  let clientes = [];
  let clientesFiltrados = [];

  let paginaAtual = 1;

  const clientesPorPagina = 10;

  // ✅ MOSTRAR USUÁRIO
  document.getElementById("usuario").textContent =
    usuario ? `👋 Olá, ${usuario}` : "";

  // ✅ CARREGAR
  async function carregar(){

    try {

      const res = await fetch(
        "/api/clientes",
        {
          headers: {
            Authorization: token
          }
        }
      );

      if (!res.ok) {
        alert("Erro ao carregar");
        return;
      }

      clientes = await res.json();

      paginaAtual =
        Number(
          localStorage.getItem("paginaClientes")
        ) || 1;

      render(clientes);

    } catch (err) {

      console.error(err);

    }

  }

  // ✅ RENDER
  function render(lista){

    clientesFiltrados = lista;

    const inicio =
      (paginaAtual - 1) * clientesPorPagina;

    const totalPaginas =
      Math.max(
        1,
        Math.ceil(lista.length / clientesPorPagina)
      );

    if (paginaAtual > totalPaginas) {
      paginaAtual = totalPaginas;
    }      


    const fim =
      inicio + clientesPorPagina;

    const pagina =
      lista.slice(inicio, fim);

    const tabela =
      document.getElementById("tabela");

    tabela.innerHTML = "";

    pagina.forEach(cliente => {

      const tr = document.createElement("tr");

      const nome =
        cliente.nomeFantasia ||
        cliente.nomePF ||
        "-";

      const documento =
        cliente.documento ||
        "-";

      tr.innerHTML = `
        <td>${nome}</td>
        <td>${documento}</td>
        <td>${cliente.cidade || "-"}</td>
        <td>${cliente.telefone || "-"}</td>
        <td>
          <button onclick="verCliente(${cliente.id})">👁</button>
          <button onclick="editarCliente(${cliente.id})">✏️</button>
          <button onclick="deletarCliente(${cliente.id})">🗑</button>
        </td>
      `;

      tabela.appendChild(tr);

    });

    if (lista.length === 0) {

      tabela.innerHTML = `
        <tr>
          <td colspan="5" style="text-align:center;">
            Nenhum cliente encontrado
          </td>
        </tr>
      `;

    }

    document.getElementById(
      "infoPagina"
    ).textContent =
      `Página ${paginaAtual} de ${totalPaginas}`;

    document.getElementById(
      "btnAnterior"
    ).disabled =
      paginaAtual === 1;

    document.getElementById(
      "btnProxima"
    ).disabled =
      paginaAtual === totalPaginas;

  }

  // ✅ PAGINAÇÃO
  function proximaPagina(){

    const totalPaginas =
      Math.ceil(
        clientesFiltrados.length /
        clientesPorPagina
      );

    if (paginaAtual < totalPaginas){

      paginaAtual++;

      render(clientesFiltrados);

    }

  }

  function paginaAnterior(){

    if (paginaAtual > 1){

      paginaAtual--;

      render(clientesFiltrados);

    }

  }

  // ✅ BUSCA
  document.getElementById("busca").addEventListener(
    "input",
    function(e){

      const termo =
        e.target.value.toLowerCase();

      const filtrados =
        clientes.filter(cliente => {

          const nome =
            (
              cliente.nomeFantasia ||
              cliente.nomePF ||
              ""
            ).toLowerCase();

          const razao =
            (
              cliente.razaoSocial ||
              ""
            ).toLowerCase();

          const documento =
            (
              cliente.documento ||
              ""
            ).toLowerCase();

          const cidade =
            (
              cliente.cidade ||
              ""
            ).toLowerCase();

          const telefone =
            (
              cliente.telefone ||
              ""
            ).toLowerCase();

          return (

            nome.includes(termo) ||

            razao.includes(termo) ||

            documento.includes(termo) ||

            cidade.includes(termo) ||

            telefone.includes(termo)

          );

        });

      paginaAtual = 1;

      render(filtrados);

    }
  );

  function voltar(){

    localStorage.removeItem(
      "paginaClientes"
    );

    window.location.href =
      "../cadastros.html";

  }

  function irHome(){

    window.location.href =
      "../../home.html";

  }

  function novoCliente(){

    localStorage.removeItem(
      "paginaClientes"
    );

    window.location.href =
      "cadastroClientes.html";

  }

  // INIT
  window.addEventListener(
    "load",
    carregar
  );

  function verCliente(id){

    window.open(
      `cadastroClientes.html?id=${id}&modo=visualizar`,
      "_blank"
    );

  }

  function editarCliente(id){

    localStorage.setItem(
      "paginaClientes",
      paginaAtual
    );

    window.location.href =
      `cadastroClientes.html?id=${id}`;

  }


  function exportarPDF(){
    window.print();
  }

  async function deletarCliente(id){

    if (
      !confirm(
        "⚠️ Deseja realmente excluir este cliente?"
      )
    ) return;

    try {

      const res = await fetch(
        `/api/clientes/${id}`,
        {
          method: "DELETE",
          headers: {
            Authorization: token
          }
        }
      );

      const data =
        await res.json();

      if (!res.ok){

        alert(
          data.erro ||
          "Erro ao excluir"
        );

        return;

      }

      alert(
        "✅ Cliente excluído com sucesso!"
      );

      carregar();

    } catch (err){

      console.error(err);

      alert(
        "Erro de conexão"
      );

    }

  }

  // ✅ LOGOUT
  function logout(){

    const confirmar = confirm(
      "⚠️ Deseja realmente sair do sistema?"
    );

    if (!confirmar) return;

    localStorage.removeItem(
      "token"
    );

    localStorage.removeItem(
      "usuario"
    );

    window.location.href =
      "../../index.html";

  }

</script>

</body>
</html>
