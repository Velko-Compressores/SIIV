<!-- public/cadastros/cadastros.html -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Setores</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Roboto, sans-serif;
  }

  body {
    background: #0f172a;
    color: #1e293b;
  }

  /* HEADER */
.header {
  background: #020617;
  color: white;
  padding: 15px 30px;

  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  align-items: center;
}

.left {
  justify-self: start;
}

.center {
  justify-self: center;
  font-size: 16px;
  color: #cbd5f5;
}

.right {
  justify-self: end;
}

.logout {
  cursor: pointer;
  color: #ef4444;
}




  /* MAIN */
  main {
    padding: 30px;
  }

  .title {
    color: #f1f5f9;
    margin-bottom: 20px;
    font-size: 22px;
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
  }

  /* CARD */
  .card {
    background: #ffffff;
    border-radius: 14px;
    padding: 25px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    position: relative;
    overflow: hidden;
  }

  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.25);
  }

  .card span {
    display: block;
    font-size: 13px;
    color: #64748b;
    margin-bottom: 5px;
  }

  .card strong {
    font-size: 18px;
    color: #0f172a;
  }

  /* cores por setor (visual bonito) */
  .recebimento { border-left: 6px solid #3b82f6; }
  .desmontagem { border-left: 6px solid #f59e0b; }
  .preparacao { border-left: 6px solid #10b981; }
  .rebobinamento { border-left: 6px solid #8b5cf6; }
  .retifica { border-left: 6px solid #ef4444; }
  .montagem { border-left: 6px solid #22c55e; }
  .testes { border-left: 6px solid #eab308; }
  .pintura { border-left: 6px solid #ec4899; }
  .finalizacao { border-left: 6px solid #06b6d4; }
  .expedicao { border-left: 6px solid #6366f1; }
  .ordemServico { border-left: 6px solid #a8f163; }
  .logistica { border-left: 6px solid #9d4ee6; }
  .clientes { border-left: 6px solid #ffe240; }

</style>
</head>

<body>

<header class="header">
  <div class="left">
    <h1 onclick="irHome()" style="cursor:pointer;">S.I.I.V.</h1>
  </div>

  <div class="center">
    <span id="usuario"></span>
  </div>

  <div class="right">
    <span class="logout" onclick="logout()"> SAIR ➜] </span>
  </div>
</header>

<main>
  <section class="grid">
    <div class="card recebimento" onclick="ir('clientes/listaClientes.html')">
      <strong>👥 CLIENTES</strong>
    </div>

    <div class="card preparacao" onclick="ir('prestadores/listaPrestadores.html')">
      <strong>🤝 PRESTADORES DE SERVIÇOS</strong>
    </div>

    <div class="card desmontagem" onclick="ir('fornecedores/listaFornecedores.html')">
      <strong>🚚 FORNECEDORES DE PRODUTOS</strong>
    </div>

  </section>
</main>

<script>
  // Proteção simples - verifica token - exibi ola usuario logado
  const token = localStorage.getItem("token");
  const usuario = localStorage.getItem("usuario");

  if (!token) window.location.href = "../index.html";
  document.getElementById("usuario").textContent =
    usuario ? `👋 Olá, ${usuario}` : "Olá";

  function ir(pagina) {
    window.location.href = pagina;
  }

  function irHome(){
      window.location.href = "../home.html";
  }

  // ✅ LOGOUT
  function logout(){
    const confirmar = confirm("⚠️ Deseja realmente sair do sistema?");
    if (!confirmar) return;
    localStorage.removeItem("token");
    localStorage.removeItem("usuario");
    window.location.href = "../index.html";
  }

</script>

</body>
</html>
