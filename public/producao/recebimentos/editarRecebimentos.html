<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Recebimento</title>

<style>

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
  }

  body{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      background:white;
  }

  .header{
    background:#020617;
    color:white;
    padding:15px 30px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    align-items:center;
  }

  .left{justify-self:start;}
  .center{justify-self:center;color:#cbd5f5;}
  .right{justify-self:end;}

  .logout{
    cursor:pointer;
    color:#ef4444;
  }

  main{
      flex: 1;
      background: white;
      padding: 30px;
  }

  .card{
    border:1px solid #e2e8f0;
    border-radius:10px;
    padding:15px;
    background:#fff;
    gap:15px;
    margin-bottom:15px;

  }

  h2{
    margin-top:5px;
    margin-bottom:15px;
    font-size:medium;
    color:#0f172a;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
  }

  .campo{
    display:flex;
    flex-direction:column;
    gap:5px;
  }

  .full{
    grid-column:span 1;
  }

  label{
    font-size:12px;
    color:#475569;
  }


  input,
  select{
    width:100%;
    padding:15px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:12px;
  }

  input:focus,
  select:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 2px rgba(59,130,246,.2);
  }


  .fotos{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(90px,1fr));
    gap:8px;
    padding:10px;
  }

  .foto{
    position:relative;
    aspect-ratio:1 / 1;
    /* max-width:150px; */
  }

  .foto img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:12px;
    display:none;

    cursor:pointer;

    position:absolute;
    top:0;
    left:0;
  }

  .foto input[type="file"]{
    display:none;
  }

  .upload-box{
    border:2px dashed #cbd5e1;
    border-radius:12px;
    background:#f8fafc;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.2s;
    text-align:center;
    padding:10px;
  }

  .upload-box:hover{
    background:#eff6ff;
    border-color:#3b82f6;
  }

  .upload-box .icone{
    font-size:28px;
    margin-bottom:5px;
  }

  .upload-box .texto{
    font-size:12px;
    color:#475569;
  }

  .upload-box .subtexto{
    font-size:10px;
    color:#94a3b8;
    margin-top:4px;
  }

  .btn-remover{
    position:absolute;
    top:5px;
    right:5px;

    width:24px;
    height:24px;

    display:none;

    align-items:center;
    justify-content:center;

    padding:0;

    border:none;
    border-radius:50%;

    background:#ef4444;
    color:#fff;

    font-size:14px;
    font-weight:bold;
    line-height:1;

    cursor:pointer;
    z-index:10;
  }

  .btn-remover:hover{
    background:#dc2626;
  }

  /* Modal para visualizar foto ampliada */
  .modal-foto{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:rgba(0,0,0,.9);

    justify-content:center;
    align-items:center;

    z-index:9999;
  }

  .modal-foto img{
    max-width:95%;
    max-height:95%;
    border-radius:12px;
    box-shadow:0 0 20px rgba(255,255,255,.2);
    cursor:zoom-out;
  }

  .modal-foto.ativo{
    display:flex;
  }


  .btn-fechar-modal{
    position:absolute;
    top:20px;
    right:20px;

    width:40px;
    height:40px;

    border:none;
    border-radius:50%;

    background:#ef4444;
    color:#fff;

    font-size:22px;
    font-weight:bold;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:10000;
  }

  .btn-fechar-modal:hover{
    background:#dc2626;
  }


  .actions{
    display:flex;
    gap:10px;
    /* margin-top:30px; */
    padding: 25px;
    background:#eff6ff;
  }

  button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
  }


  /* Pesquisar clientes */
  #listaClientes{
    position: relative;
    width: 100%;
  }

  .itemCliente{
    background: white;
    border: 1px solid #cbd5e1;
    border-top: none;
    padding: 10px;
    cursor: pointer;
  }

  .itemCliente:hover{
    background: #f1f5f9;
  }


  .footer-actions{
    display: flex;
    gap: 10px;
    padding: 25px;
    background: white;
  }

  button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }

  .voltar {
    background: #334155;
    color: white;
  }

  .voltar:hover {
    background: #475569;
  }

  .salvar{
    background:#22c55e;
    color:white;
  }

  .salvar:hover{
    background:#16a34a;
  }

  .exportar {
    background: #e4af1f;
    color: white;
  }

  .exportar:hover {
    background: #ecc149;
  }

  td button {
    margin: 2px;
    padding: 6px 8px;
    font-size: 12px;
    border-radius: 6px;
  }

  td button:hover {
    opacity: 0.8;
  }


  /* ================= Exportar PDF ================= */
  @media print{

    /* Oculta elementos desnecessários */
    .header,
    .footer-actions,
    .logout,
    .modal-foto,
    .btn-fechar-modal,
    .btn-remover{
      display:none !important;
    }

    .ocultar-pdf{
      display:none !important;
    }


    /* Remove margens */
    body,
    main{
      margin:0;
      padding:0;
      background:white;
    }

    /* Cards sem borda */
.card{
  border:none !important;
  box-shadow:none !important;
  margin-bottom:5px !important;
  padding:4px 0 !important;
}

.controle-card .grid{
  grid-template-columns:
    repeat(4, 1fr) !important;
}


    /* Títulos das seções */
h2{
  color:black;
  border-bottom:1px solid #e5e7eb;
  padding-bottom:2px;
  margin-bottom:4px;
}

.grid{
  gap:8px !important;
}

    /* Inputs e selects viram texto */
    input,
    select{
      border:none !important;
      box-shadow:none !important;
      background:transparent !important;
      padding:2px 0 !important;
      color:black !important;
    }

    input:focus,
    select:focus{
      outline:none !important;
      box-shadow:none !important;
    }

    /* Labels discretos */
    label{
      color:#64748b;
      font-size:11px;
      font-weight:600;
    }

    /* Fotos */

    select{
      appearance:none !important;
      -webkit-appearance:none !important;
      -moz-appearance:none !important;

      background-image:none !important;
    }

    .foto{
      border:none !important;
      background:none !important;
    }

    .fotos{
      display:grid !important;
      grid-template-columns:repeat(6, 1fr) !important;
      gap:8px !important;
    }    

  }

</style>

  <script>

// ================= AUTENTICAÇÃO =================
    const token = localStorage.getItem("token");
    const usuario = localStorage.getItem("usuario");

    if(!token){
      location.href = "../../index.html";
    }

    document.getElementById("usuario").textContent =
      usuario ? `👋 Olá, ${usuario}` : "";

// ================= VARIÁVEIS GLOBAIS =================
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const modo = params.get("modo");
    const fotosRemovidas = [];

// ================= MODO VISUALIZAÇÃO =================
    // função modo de visualizacao
    function ativarModoVisualizacao(){
      document
        .querySelectorAll("input, select")
        .forEach(el => {

          el.disabled = true;
        });
      document
        .querySelector(".salvar")
        .style.display = "none";
    }

// ================= FOTOS =================

    function preview(input,id){

      if(!input.files.length){
        return;
      }

      const img =
        document.getElementById(id);

      img.src =
        URL.createObjectURL(
          input.files[0]
        );

      img.onclick = () => {
        ampliarFoto(img.src);
      };

      img.style.display = "block";

      const uploadBox =
        input.parentElement.querySelector(
          ".upload-box"
        );

      uploadBox.style.display = "none";

      const btnExcluir =
        input.parentElement.querySelector(
          ".btn-remover"
        );

      if(btnExcluir){
        btnExcluir.style.display = "flex";
      }

    }
    // função removerFoto
    function removerFoto(
      inputId,
      imgId,
      botao
    ){

      const numero =
        imgId.replace("img","");

      if(!fotosRemovidas.includes(numero)){
        fotosRemovidas.push(numero);
      }

      const input =
        document.getElementById(inputId);

      const img =
        document.getElementById(imgId);

      input.value = "";

      img.src = "";
      img.style.display = "none";

      const uploadBox =
        input.parentElement.querySelector(
          ".upload-box"
        );

      uploadBox.style.display = "flex";

      botao.style.display = "none";

    }

    // function carregarFoto-funcao para carregar as fotos
    async function carregarFoto(numero){

      try{

        const res = await fetch(
          `/api/recebimentos/${id}/foto${numero}`,
          {
            headers:{
              Authorization: token
            }
          }
        );

        const container =
          document.getElementById(`img${numero}`)
          .parentElement;

        if(!res.ok){
          const uploadBox =
            container.querySelector(".upload-box");

          if(uploadBox){
            uploadBox.style.display = "flex";
          }
          return;
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);

        const img =
          document.getElementById(`img${numero}`);

        img.src = url;

        img.onclick = () => {
          ampliarFoto(img.src);
        };

        img.style.display = "block";

        const uploadBox =
          container.querySelector(
            ".upload-box"
          );

        if(uploadBox){
          uploadBox.style.display = "none";
        }

        const btnExcluir =
          container.querySelector(
            ".btn-remover"
          );

        if(btnExcluir){
          btnExcluir.style.display = "flex";
        }
      }
      catch(err){
        console.error(err);
      }
    }

    // Function Modal para visualizar foto ampliada
    function ampliarFoto(src){
      const modal = document.getElementById("modalFoto");
      const imagem = document.getElementById("imagemModal");
      imagem.src = src;
      modal.classList.add("ativo");
    }
    // Function Fechar foto modal
    function fecharModalFoto(){
      document
        .getElementById("modalFoto")
        .classList.remove("ativo");
    }

        if(
          !img.src ||
          img.style.display === "none"

// ================= CLIENTES =================
    // function buscar clientes
    async function buscarClientes(){

      const termo =
        document.getElementById("cliente")
        .value
        .trim()
        .toLowerCase();

      const lista =
        document.getElementById("listaClientes");

      lista.innerHTML = "";

      if(termo.length < 2){
        return;
      }

      try{

        const res = await fetch(
          "/api/clientes",
          {
            headers:{
              Authorization: token
            }
          }
        );

        if(!res.ok){
          return;
        }

        const clientes = await res.json();

        const encontrados =
          clientes.filter(cliente => {

            const nomePF =
              (cliente.nomePF || "")
              .toLowerCase();

            const nomeFantasia =
              (cliente.nomeFantasia || "")
              .toLowerCase();

            const razaoSocial =
              (cliente.razaoSocial || "")
              .toLowerCase();

            return (
              nomePF.includes(termo) ||
              nomeFantasia.includes(termo) ||
              razaoSocial.includes(termo)
            );

        });

        encontrados.forEach(cliente => {

          const item =
            document.createElement("div");

          item.className =
            "itemCliente";

          item.textContent =
            cliente.nomePF ||
            cliente.nomeFantasia ||
            cliente.razaoSocial ||
            "";

          item.onclick = () =>
            selecionarCliente(cliente);

          lista.appendChild(item);
        });
      }
      catch(err){
        console.error(err);
      }
    }
    // function selecionar clientes
    function selecionarCliente(cliente){
      document.getElementById(
        "clienteId"
      ).value =
        cliente.id;

      document.getElementById(
        "cliente"
      ).value =
        cliente.nomePF ||
        cliente.nomeFantasia ||
        cliente.razaoSocial ||
        "";

      document.getElementById(
        "documento"
      ).value =
        cliente.documento || "";

      document.getElementById(
        "nomeCliente"
      ).value =
        cliente.razaoSocial ||
        cliente.nomeFantasia ||
        cliente.nomePF ||
        "";

      document.getElementById(
        "nomeSolicitante"
      ).value =
        cliente.responsavel1 || "";

      document.getElementById(
        "telefoneSolicitante"
      ).value =
        cliente.telefoneResponsavel1 || "";

      document.getElementById(
        "emailSolicitante"
      ).value =
        cliente.emailResponsavel1 || "";


      document.getElementById(
        "listaClientes"
      ).innerHTML = "";

    }
