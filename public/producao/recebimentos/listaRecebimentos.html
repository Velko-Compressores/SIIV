<!-- public/producao/recebimentos/listaRecebimentos.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Lista de Recebimentos</title>

<style>
  
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Roboto, sans-serif;
  }

  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:white;
  }

  /* HEADER */
  .header {
    background: #020617;
    color: white;
    padding: 15px 30px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: center;
  }

  .left { justify-self: start; }
  .center { justify-self: center; color: #cbd5f5; }
  .right { justify-self: end; }
  .logout { cursor: pointer; color: #ef4444; }

  main {
    flex: 1;
    background: white;
    padding: 30px;
  }

  h2 {
    margin-bottom: 15px;
    color: #0f172a;
  }

  input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    margin-bottom: 15px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th {
    background: #020617;
    color: white;
    padding: 10px;
    text-align: center;
  }

  tr:hover {
    background: #f1f5f9;
  }

  td {
    padding: 10px;
    border-bottom: 1px solid #e2e8f0;
    text-align: center;
  }

  td button{
    cursor:pointer;
    margin:2px;
    padding:6px 8px;
    font-size:12px;

    border:none;
    border-radius:6px;
  }

  td button:hover {
    opacity: 0.8;
  }


  /* Botão da Ordem de Serviço */

  .btn-os{
    min-width:110px;
    height:34px;
    border:none;
    border-radius:6px;
    background:#98b6f8;
    color:white;
    font-weight:bold;
    cursor:pointer;
  }

  .btn-os:hover{
    background:#1d4ed8;
  }

  /* Botão Arquivar */
  .btn-arquivar{
    min-width:110px;
    height:34px;
    border:none;
    border-radius:6px;
    background:#78c2bc;
    color:white;
    font-weight:bold;
    cursor:pointer;
  }

  .btn-arquivar:hover{
    background:#94ddd7;
  }



/* Seção de Paginação */

  #paginacao{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin:30px 0;
  }

  #paginacao button{
    flex:unset;
    padding:6px 12px;
    font-size:13px;
    border:1px solid #cbd5e1;
    border-radius:6px;
    background:transparent;
    color:#475569;
    transition:.2s;
  }

  #paginacao button:hover:not(:disabled){
    background:#f1f5f9;
    border-color:#94a3b8;
  }

  #paginacao button:disabled{
    opacity:.4;
    cursor:not-allowed;
  }

  #infoPagina{
    min-width:90px;
    text-align:center;
    font-size:13px;
    font-weight:500;
    color:#64748b;
  }

  .footer-actions{
    display: flex;
    gap: 10px;
    padding: 25px;
    background: white;
  }

  .footer-actions button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }

  .voltar {
    background: #334155;
    color: white;
  }

  .voltar:hover {
    background: #475569;
  }

  .exportar {
    background: #e4af1f;
    color: white;
  }

  .exportar:hover {
    background: #ecc149;
  }

  .arquivos{
    background:#78c2bc;
    color:white;
  }

  .arquivos:hover{
    background:#94ddd7;
  }



  /* ================= Exportar PDF ================= */
  @media print{

    /* Oculta elementos da tela */
    .header,
    .footer-actions,
    #busca,
    #paginacao,
    .logout{
      display:none !important;
    }

    /* Remove margens */
    body,
    main{
      margin:0;
      padding:0;
      background:white;
    }

    /* Título */
    h2{
      text-align:center;
      margin-bottom:12px;
      font-size:18px;
      color:black;
    }

    /* Tabela */
    table{
      width:auto;
      margin:auto;
      border-collapse:collapse;
      font-size:11px;
    }

    /* Oculta coluna AÇÕES */
    table th:nth-child(5),
    table td:nth-child(5){
      display:none;
    }

    /* Largura das colunas */
    th:nth-child(1),
    td:nth-child(1){
      width:80px;
    }

    th:nth-child(2),
    td:nth-child(2){
      width:250px;
    }

    th:nth-child(3),
    td:nth-child(3){
      width:120px;
    }

    th:nth-child(4),
    td:nth-child(4){
      width:120px;
    }

    /* Bordas da tabela */
    th,
    td{
      border:1px solid #f3f7f8;
      padding:4px 6px;
      text-align:center;
    }

    /* Cabeçalho da tabela */
    th{
      background:white !important;
      color:black !important;
    }

    /* Botão da OS vira texto */
    .btn-os{
      background:none !important;
      color:black !important;
      border:none !important;
      min-width:auto !important;
      height:auto !important;
      padding:0 !important;
      margin:0 !important;
      font-size:11px;
      font-weight:bold;
      pointer-events:none;
    }

    /* Arquivar não aparece */
    .btn-arquivar{
      display:none !important;
    }

  }

</style>
</head>

<body>

<header class="header">

  <div class="left">
    <h1 onclick="irHome()" style="cursor:pointer;">
      S.I.I.V.
    </h1>
  </div>

  <div class="center">
    <span id="usuario"></span>
  </div>

  <div class="right">
    <span class="logout" onclick="logout()"> SAIR ➜] </span>
  </div>

</header>

<main class="main">

  <h2>EQUIPAMENTOS RECEBIDOS</h2>
  <input id="busca" placeholder="🔍 Buscar OS, cliente, fabricante ou modelo..." >

  <table>
    <thead>
      <tr>
        <th>OS</th>
        <th>CLIENTE</th>
        <th>FABRICANTE</th>
        <th>MODELO</th>
        <th>AÇÕES</th>
      </tr>
    </thead>

    <tbody id="tabela"></tbody>
  </table>

  <div id="paginacao">
    <button id="btnAnterior" onclick="paginaAnterior()"> ◀ Anterior </button>
    <span id="infoPagina"></span>
    <button id="btnProxima"  onclick="proximaPagina()"> Próxima ▶ </button>
  </div>

</main>

<footer class="footer-actions">
  <button class="voltar" onclick="voltar()" > ⬅ VOLTAR </button>
  <button class="arquivos" onclick="arquivos()" > 🗃️ ARQUIVOS </button>
  <button class="exportar" onclick="exportarPDF()"> 🖨️ EXPORTAR PDF </button>
</footer>

<script>

// ================= AUTENTICAÇÃO =================
  const token = localStorage.getItem("token");
  if (!token){
    window.location.href = "../../index.html";
  }
  const usuario = localStorage.getItem("usuario");

  document.getElementById("usuario").textContent =
    usuario ? `👋 Olá, ${usuario}` : "";

// ================= VARIÁVEIS GLOBAIS =================
  // Armazena todos os recebimentos carregados do banco  
  let recebimentos = []; 
  // Armazena os recebimentos após aplicação dos filtros 
  let recebimentosFiltrados = [];
  // Controle de paginação
  let paginaAtual = 1;
  const itensPorPagina = 10;

// ================= CARREGAMENTO =================
  // Busca todos os recebimentos cadastrados
  async function carregar(){
    try {
      const res =
        await fetch(
          "/api/recebimentos",
          {
            headers:{
              Authorization: token
            }
          }
        );
        
      if (!res.ok){
        alert("Erro ao carregar recebimentos");
        return;
      }

      recebimentos =
        await res.json();

      render(recebimentos,paginaAtual);

    }
    catch(err){
      console.error(err);
    }

  }

// ================= RENDERIZAÇÃO =================
  // Monta a tabela de recebimentos
  function render(lista, pagina = 1){

    recebimentosFiltrados = lista;

    const tabela = document.getElementById("tabela");
    tabela.innerHTML = "";

    const totalPaginas =
      Math.max(
        1,
        Math.ceil(lista.length / itensPorPagina)
      );

    if(pagina > totalPaginas){
      pagina = totalPaginas;
    }
    paginaAtual = pagina;

    const inicio = (pagina - 1) * itensPorPagina;
    const fim = inicio + itensPorPagina;
    const paginaDados = lista.slice(inicio, fim);

    paginaDados.forEach(recebimento => {
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>
          <button
            class="btn-os"
            onclick="editarRecebimento(${recebimento.id})"
          >
            📋 ${recebimento.numeroOS || "-"}
          </button>
        </td>

        <td>${recebimento.nomeFantasia || "-"}</td>
        <td>${recebimento.fabricante || "-"}</td>
        <td>${recebimento.modelo || "-"}</td>

        <td>
          <button
            class="btn-arquivar"
            onclick="arquivarRecebimento(${recebimento.id})"
          >
            🗃️ ARQUIVAR
          </button>
        </td>
      `;      
      tabela.appendChild(tr);
    });

    document.getElementById(
      "infoPagina"
    ).textContent =
      `Página ${paginaAtual} de ${totalPaginas}`;

    document.getElementById(
      "btnAnterior"
    ).disabled =
      paginaAtual === 1;

    document.getElementById(
      "btnProxima"
    ).disabled =
      paginaAtual === totalPaginas;
  }

// ================= PAGINAÇÃO =================
  // Avança para a próxima página
  function proximaPagina(){
    const totalPaginas =
      Math.ceil(
        recebimentosFiltrados.length /
        itensPorPagina
      );
    if(paginaAtual < totalPaginas){
      paginaAtual++;
      render(recebimentosFiltrados,paginaAtual);
    }
  }
  
  // Retorna para a página anterior
  function paginaAnterior(){
    if(paginaAtual > 1){
      paginaAtual--;
      render(recebimentosFiltrados,paginaAtual);
    }
  }

// ================= BUSCA =================
  // Filtra os recebimentos em tempo real
  document.getElementById("busca")
    .addEventListener("input", function(e){

      const termo =
        e.target.value.toLowerCase();

      const filtrados =
        recebimentos.filter(recebimento => {

          return (

            (recebimento.numeroOS || "")
              .toLowerCase()
              .includes(termo)

            ||

            (recebimento.nomeFantasia || "")
              .toLowerCase()
              .includes(termo)

            ||

            (recebimento.razaoSocial || "")
              .toLowerCase()
              .includes(termo)

            ||

            (recebimento.fabricante || "")
              .toLowerCase()
              .includes(termo)

            ||

            (recebimento.modelo || "")
              .toLowerCase()
              .includes(termo)

          );

        });

      paginaAtual = 1;
      render(filtrados, paginaAtual);

  });

// ================= AÇÕES =================
  // Abre a tela de edição
  function editarRecebimento(id){
    window.location.href =
      `editarRecebimentos.html?id=${id}`;
  }
  // Função de arquivar um recebimento
  async function arquivarRecebimento(id){
    const confirmar =
      confirm(
        "Deseja arquivar esta OS?"
      );
    if(!confirmar){
      return;
    }
    try{
      const res =
        await fetch(
          `/api/recebimentos/${id}/arquivar`,
          {
            method:"PUT",
            headers:{
              Authorization: token
            }
          }
        );
      const data =
        await res.json();
      if(!res.ok){
        alert(
          data.erro ||
          "Erro ao arquivar recebimento"
        );
        return;
      }
      alert(
        "✅ Recebimento arquivado com sucesso."
      );
      carregar();
    }
    catch(err){
      console.error(err);
      alert(
        "Erro ao comunicar com o servidor."
      );
    }
  }

  // Futura página de recebimentos arquivados
  function arquivos(){
    window.location.href =
      "listaArquivados.html";
  }
  
  // Função de exportar PDF da lista
    function exportarPDF(){
      window.print();
    }

// ================= NAVEGAÇÃO =================
  // Retorna para a tela anterior
  function voltar(){
    window.location.href =
      "recebimentos.html";
  }
  // Retorna para a página inicial
  function irHome(){
    window.location.href =
      "../../home.html";
  }

// ================= LOGOUT =================
  function logout(){
    const confirmar =
      confirm("⚠️ Deseja realmente sair do sistema?");
    if(!confirmar) return;
    localStorage.removeItem("token");
    localStorage.removeItem("usuario");
    window.location.href =
      "../../index.html";
  }

// ================= INICIALIZAÇÃO =================
// Carrega a lista ao abrir a página
  window.addEventListener(
    "load",
    carregar
  );

</script>

</body>
</html>
