<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Recebimento</title>

<style>

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
  }

  body{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      background:white;
  }

  .header{
    background:#020617;
    color:white;
    padding:15px 30px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    align-items:center;
  }

  .left{justify-self:start;}
  .center{justify-self:center;color:#cbd5f5;}
  .right{justify-self:end;}

  .logout{
    cursor:pointer;
    color:#ef4444;
  }

  main{
      flex: 1;
      background: white;
      padding: 30px;
  }

  .card{
    border:1px solid #e2e8f0;
    border-radius:10px;
    padding:15px;
    background:#fff;
    gap:15px;
    margin-bottom:15px;
  }

  h2{
    margin-top:5px;
    margin-bottom:15px;
    font-size:medium;
    color:#0f172a;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
  }

  .campo{
    display:flex;
    flex-direction:column;
    gap:5px;
  }

  .full{
    grid-column:span 1;
  }

  label{
    font-size:12px;
    color:#475569;
  }


  input,
  select{
    width:100%;
    padding:15px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:12px;
  }

  input:focus,
  select:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 2px rgba(59,130,246,.2);
  }


  .fotos{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(90px,1fr));
    gap:8px;
    padding:10px;
  }

  .foto{
    position:relative;
    aspect-ratio:1 / 1;
    /* max-width:150px; */
  }

  .foto img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:12px;
    display:none;

    position:absolute;
    top:0;
    left:0;
  }


  .foto input[type="file"]{
    display:none;
  }

  .upload-box{
    border:2px dashed #cbd5e1;
    border-radius:12px;
    background:#f8fafc;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.2s;
    text-align:center;
    padding:10px;
  }

  .upload-box:hover{
    background:#eff6ff;
    border-color:#3b82f6;
  }

  .upload-box .icone{
    font-size:28px;
    margin-bottom:5px;
  }

  .upload-box .texto{
    font-size:12px;
    color:#475569;
  }

  .upload-box .subtexto{
    font-size:10px;
    color:#94a3b8;
    margin-top:4px;
  }

  .btn-remover{
    position:absolute;
    top:5px;
    right:5px;

    width:24px;
    height:24px;

    display:none;

    align-items:center;
    justify-content:center;

    padding:0;

    border:none;
    border-radius:50%;

    background:#ef4444;
    color:#fff;

    font-size:14px;
    font-weight:bold;
    line-height:1;

    cursor:pointer;
    z-index:10;
  }

  .btn-remover:hover{
    background:#dc2626;
  }

  /* Modal para visualizar foto ampliada */
  .modal-foto{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:rgba(0,0,0,.9);

    justify-content:center;
    align-items:center;
 
    z-index:9999;
  }

  .modal-foto img{
    max-width:95%;
    max-height:95%;
    border-radius:12px;
    box-shadow:0 0 20px rgba(255,255,255,.2);
    cursor:zoom-out;
  }

  .modal-foto.ativo{
    display:flex;
  }


  .btn-fechar-modal{
    position:absolute;
    top:20px;
    right:20px;

    width:40px;
    height:40px;

    border:none;
    border-radius:50%;

    background:#ef4444;
    color:#fff;

    font-size:22px;
    font-weight:bold;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:10000;
  }

  .btn-fechar-modal:hover{
    background:#dc2626;
  }


  button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
  }

  .salvar{
    background:#22c55e;
    color:white;
  }

  .salvar:hover{
    background:#16a34a;
  }

  .voltar {
    background: #334155;
    color: white;
  }

  .voltar:hover {
    background: #475569;
  }

  /* Pesquisar clientes */
  #listaClientes{
    position: relative;
    width: 100%;
  }

  .itemCliente{
    background: white;
    border: 1px solid #cbd5e1;
    border-top: none;
    padding: 10px;
    cursor: pointer;
  }

  .itemCliente:hover{
    background: #f1f5f9;
  }



  .cadastrar-cliente{

    font-weight:600;
  }

  .cadastrar-cliente:hover{
    background:#dbeafe;
  }


  .footer-actions{
    display: flex;
    gap: 10px;
    padding: 25px;
    background: white;
  }


</style>

<script>
 
// =========AUTENTICAÇÃO=======================

  const token = localStorage.getItem("token");
  const usuario = localStorage.getItem("usuario");

  if(!token){ 
    location.href = "../../index.html";
  }

  document.getElementById("usuario").textContent =
    usuario ? `👋 Olá, ${usuario}` : "";

  function logout(){
    const confirmar =
      confirm("Deseja sair do sistema?");
    if(!confirmar) return;
    
    localStorage.removeItem("token");
    localStorage.removeItem("usuario");

    location.href = "../../index.html";
  }

// ============NAVEGAÇÃO===================

  function voltar(){
    location.href = "recebimentos.html";
  }

  function irHome(){
    location.href = "../../home.html";
  }

// ============FOTOS=====================

// Exibe a pré-visualização da foto selecionada
// e oculta a caixa de upload
  function preview(input,id){
    if(!input.files.length) return;
    const img = document.getElementById(id);
    img.src = URL.createObjectURL(input.files[0]);
    img.onclick = () => {
      ampliarFoto(img.src);
    };

    img.style.display = "block";
    const uploadBox = input.parentElement.querySelector(".upload-box");
    uploadBox.style.display = "none";
    const btnExcluir = input.parentElement.querySelector(".btn-remover");

    if(btnExcluir){
      btnExcluir.style.display = "flex";
    }
  }

  // Função para remover foto
  function removerFoto(inputId, imgId, botao){
    const input =
      document.getElementById(inputId);
    const img =
      document.getElementById(imgId);
    input.value = "";
    img.src = "";
    img.style.display = "none";
    const uploadBox =
      input.parentElement.querySelector(".upload-box");
    uploadBox.style.display = "flex";
    botao.style.display = "none";
  }

  // Funcao no modal para visualizar foto ampliada
  function ampliarFoto(src){
    const modal = document.getElementById("modalFoto");
    const imagem = document.getElementById("imagemModal");
    imagem.src = src;
    modal.classList.add("ativo");
  }

  // Funcao para Fechar foto modal
  function fecharModalFoto(){
    document
      .getElementById("modalFoto")
      .classList.remove("ativo");
  }

  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape"){
      fecharModalFoto();
    }
  });

// ===========CLIENTES=================

  // Funcao para buscar clientes cadastrados no banco
  async function buscarClientes(){

    const termo =
      document.getElementById("cliente")
      .value
      .trim()
      .toLowerCase();

    const lista =
      document.getElementById("listaClientes");

    lista.innerHTML = "";

    if(termo.length < 2){
      return;
    }

    try{

      const res = await fetch(
        "/api/clientes",
        {
          headers:{
            Authorization: token
          }
        }
      );

      if(!res.ok){
        return;
      }

      const clientes = await res.json();

      const encontrados =
        clientes.filter(cliente => {

          const nomePF =
            (cliente.nomePF || "")
            .toLowerCase();

          const nomeFantasia =
            (cliente.nomeFantasia || "")
            .toLowerCase();

          const razaoSocial =
            (cliente.razaoSocial || "")
            .toLowerCase();

          return (
            nomePF.includes(termo) ||
            nomeFantasia.includes(termo) ||
            razaoSocial.includes(termo)
          );

        });

        // Nova função para cadastrar um novo cliente
        if(encontrados.length === 0){

          lista.innerHTML = `
            <div class="itemCliente">
              Cliente não encontrado
            </div>

            <div
              class="itemCliente cadastrar-cliente"
              onclick="novoCliente()">

              ➕ Cadastrar cliente

            </div>
          `;

          return;
        }


      encontrados.forEach(cliente => {

        const item =
          document.createElement("div");

        item.className =
          "itemCliente";

        item.textContent =
          cliente.nomePF ||
          cliente.nomeFantasia ||
          cliente.razaoSocial ||
          "";

        item.onclick = () =>
          selecionarCliente(cliente);

        lista.appendChild(item);
      });
    }
    catch(err){
      console.error(err);
    }
  }

  // Funcao para selecionar clientes cadastrados no banco

// ===========DATA E HORA========================

  function obterDataHoraAtual(){
    const agora = new Date();
    const ano = agora.getFullYear();
    const mes = String(
        agora.getMonth() + 1
      ).padStart(2,"0");
    const dia = String(
        agora.getDate()
      ).padStart(2,"0");
    const hora = String(
        agora.getHours()
      ).padStart(2,"0");
    const minuto =  String(
        agora.getMinutes()
      ).padStart(2,"0");
    return `${ano}-${mes}-${dia}T${hora}:${minuto}`;
  }

// ==================SALVAMENTO=============

  // function salvar
  async function salvar(){

    document.getElementById(
      "dataHoraLiberacao"
    ).value =
      obterDataHoraAtual();

    const formData = new FormData();

    // Obriga o usuário a selecionar um cliente
    const clienteId = document.getElementById("clienteId").value;
    if(!clienteId){
      alert("Selecione um cliente.");
      return;
    };

    formData.append(
      "clienteId",
      clienteId
    );

    formData.append(
      "nomeFantasia",
      document.getElementById("cliente").value
    );

    formData.append(
      "razaoSocial",
      document.getElementById("nomeCliente").value
    );

    formData.append(
      "documento",
      document.getElementById("documento").value
    );


    formData.append(
      "garantia",
      document.getElementById("garantia").value
    );

    formData.append(
      "notaFiscal",
      document.getElementById("notaFiscal").value
    );

    formData.append(
      "transporte",
      document.getElementById("transporte").value
    );

    formData.append(
      "nomeSolicitante",
      document.getElementById("nomeSolicitante").value
    );

    formData.append(
      "telefoneSolicitante",
      document.getElementById("telefoneSolicitante").value
    );

    formData.append(
      "emailSolicitante",
      document.getElementById("emailSolicitante").value
    );

    formData.append(
      "fabricante",
      document.getElementById("fabricante").value
    );

    formData.append(
      "tipo",
      document.getElementById("tipo").value
    );

    formData.append(
      "modelo",
      document.getElementById("modelo").value
    );

    formData.append(
      "tensao",
      document.getElementById("tensao").value
    );

    formData.append(
      "numeroSerie",
      document.getElementById("numeroSerie").value
    );


    formData.append(
      "recebidoPor",
      document.getElementById("recebidoPor").value
    );

    formData.append(
      "dataHoraRecebimento",
      document.getElementById(
        "dataHoraRecebimento"
      ).value
    );

    formData.append(
      "dataHoraLiberacao",
      document.getElementById(
        "dataHoraLiberacao"
      ).value
    );

    formData.append(
      "liberadoPor",
      document.getElementById("liberadoPor").value
    );

    // Fotos
    for(let i = 1; i <= 12; i++){
      const foto = document.getElementById(`foto${i}`);

      if(foto.files.length){
        formData.append(
          `foto${i}`,
          foto.files[0]
        );
      }
    } 

    try{
      const res = await fetch(
        "/api/recebimentos",
        {
          method: "POST",
          headers:{
            Authorization: token
          },
          body: formData
        }
      );

      const data = await res.json();
      if(!res.ok){
        alert(data.erro || "Erro ao salvar");
        return;
      }
      alert(`✅ Recebimento salvo!\nNúmero da OS: ${data.numeroOS}`);

      window.location.href =
        "listaRecebimentos.html";
    }
    catch(err){
      console.error(err);
      alert(  "Erro ao comunicar com servidor" );
    }

  }
