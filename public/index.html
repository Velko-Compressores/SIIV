<!-- public/index.html -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Login - S.I.I.V</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Roboto, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .login-card h1 {
      margin-bottom: 10px;
      font-size: 24px;
      color: #0f172a;
    }

    .login-card p {
      margin-bottom: 25px;
      color: #64748b;
      font-size: 14px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .input-group {
      text-align: left;
    }

    label {
      font-size: 14px;
      color: #334155;
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      outline: none;
      transition: 0.3s;
      font-size: 14px;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    button {
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #2563eb;
    }

    .erro {
      margin-top: 10px;
      color: #e11d48;
      font-size: 14px;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <main>
    <section class="login-card">
      <h1>🔧 S.I.I.V</h1>
      <p>Faça login para continuar</p>

      <form id="loginForm">
        <div class="input-group">
          <label for="nome">Usuário</label>
          <input type="text" id="nome" required />
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required />
        </div>

        <button type="submit">Entrar</button>
      </form>

      <div class="erro" id="erro"></div>

      <div class="footer">
        © Oficina - Sistema interno
      </div>
    </section>
  </main>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const nome = document.getElementById("nome").value;
    const senha = document.getElementById("senha").value;
    const erroDiv = document.getElementById("erro");

    erroDiv.textContent = "";

    try {
      const res = await fetch("http://192.168.7.25:3000/api/users/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nome, senha })
      });

      const data = await res.json();

      if (!res.ok) {
        erroDiv.textContent = data.error;
        return;
      }

      // ✅ SALVA TOKEN + USUÁRIO
      localStorage.setItem("token", data.token);
      localStorage.setItem("usuario", nome);

      window.location.href = "home.html";

    } catch {
      erroDiv.textContent = "Erro ao conectar com o servidor";
    }
  });
</script>
</body>
</html>
